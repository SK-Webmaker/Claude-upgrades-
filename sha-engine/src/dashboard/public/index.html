<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair by Sha — Control Room</title>
<style>
  :root{
    --brass:#B07C33; --brass-lt:#C99A52; --violet:#6A5B8C; --violet-lt:#8C7CB0;
    --bg:#0E1013; --panel:#15181D; --panel-2:#1B1F25; --line:#252A31; --line-2:#333942;
    --text:#ECEEF1; --text-2:#9BA2AC; --text-3:#6B727C;
    --good:#4E9B76; --warn:#C79742; --crit:#C0655A; --idle:#3A414A;
    --serif:'Didot','Bodoni MT','Hoefler Text',Georgia,serif;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --r:3px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#F6F6F7; --panel:#FFFFFF; --panel-2:#F0F1F3; --line:#E2E4E8; --line-2:#CBCED4;
      --text:#14171B; --text-2:#535963; --text-3:#868C96; --idle:#D3D7DD;
      --brass:#8A5E22; --violet:#584A78;
      --good:#33765A; --warn:#96701F; --crit:#9A4034;
    }
  }
  :root[data-theme="light"]{
    --bg:#F6F6F7; --panel:#FFFFFF; --panel-2:#F0F1F3; --line:#E2E4E8; --line-2:#CBCED4;
    --text:#14171B; --text-2:#535963; --text-3:#868C96; --idle:#D3D7DD;
    --brass:#8A5E22; --violet:#584A78;
    --good:#33765A; --warn:#96701F; --crit:#9A4034;
  }
  :root[data-theme="dark"]{
    --bg:#0E1013; --panel:#15181D; --panel-2:#1B1F25; --line:#252A31; --line-2:#333942;
    --text:#ECEEF1; --text-2:#9BA2AC; --text-3:#6B727C; --idle:#3A414A;
    --brass:#B07C33; --violet:#6A5B8C;
    --good:#4E9B76; --warn:#C79742; --crit:#C0655A;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.15em;
    text-transform:uppercase;color:var(--text-3)}
  h1,h2,h3{margin:0;text-wrap:balance}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  /* header */
  header{display:flex;flex-wrap:wrap;gap:1rem;align-items:baseline;justify-content:space-between;
    padding:1.5rem 1.75rem;border-bottom:1px solid var(--line);background:var(--panel)}
  .brandline{font-family:var(--serif);font-size:1.75rem;line-height:1;letter-spacing:-.01em}
  .brandline em{font-style:italic;color:var(--brass)}
  .hdr-meta{display:flex;gap:1.25rem;flex-wrap:wrap;font-family:var(--mono);font-size:.72rem;color:var(--text-2)}
  .hdr-meta b{color:var(--text);font-weight:500}
  .live{display:inline-flex;align-items:center;gap:.45em;font-family:var(--mono);
    font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--idle)}
  .dot.on{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}

  main{padding:1.5rem 1.75rem 4rem;max-width:1500px;margin:0 auto;display:grid;gap:1.25rem}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
  .panel > .phead{display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:.85rem 1.1rem;border-bottom:1px solid var(--line)}
  .pbody{padding:1.1rem}

  /* pipeline */
  .pipeline{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));padding:1.1rem}
  .node{position:relative;background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--r);padding:.8rem .85rem;display:grid;gap:.35rem;overflow:hidden}
  .node::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--idle)}
  .node[data-status="running"]::after{background:var(--brass)}
  .node[data-status="done"]::after{background:var(--good)}
  .node[data-status="failed"]::after{background:var(--crit)}
  .node[data-status="running"]{border-color:var(--brass)}
  .node-name{font-size:.9rem;font-weight:600;letter-spacing:-.01em}
  .node-status{font-family:var(--mono);font-size:.65rem;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
  .node[data-status="running"] .node-status{color:var(--brass)}
  .node[data-status="done"] .node-status{color:var(--good)}
  .node[data-status="failed"] .node-status{color:var(--crit)}
  .node .bar{height:2px;background:var(--line-2);border-radius:2px;overflow:hidden;margin-top:.15rem}
  .node .bar i{display:block;height:100%;width:0;background:var(--brass);transition:width .35s ease}
  .node[data-status="running"] .node-name::after{content:'';display:inline-block;width:5px;height:5px;
    margin-left:.45em;border-radius:50%;background:var(--brass);animation:pulse 1.1s ease-in-out infinite;vertical-align:middle}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  .runbtn{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--text-3);border:1px solid var(--line-2);border-radius:2px;padding:.28em .5em;
    transition:color .15s,border-color .15s;justify-self:start}
  .runbtn:hover{color:var(--brass);border-color:var(--brass)}

  /* grid */
  .cols{display:grid;gap:1.25rem;grid-template-columns:1fr}
  @media(min-width:1080px){.cols{grid-template-columns:1.45fr 1fr}}

  /* stat strip */
  .stats{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:.85rem 1rem}
  .stat .v{font-family:var(--serif);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-family:var(--mono);font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3);margin-top:.4rem}
  .stat.alert .v{color:var(--warn)}
  .stat.good .v{color:var(--good)}

  /* approvals */
  .queue{display:grid;gap:.75rem}
  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    display:grid;grid-template-columns:1fr;overflow:hidden}
  @media(min-width:640px){.card{grid-template-columns:132px 1fr}}
  .card video{width:100%;height:100%;max-height:250px;object-fit:cover;background:#000;display:block}
  .card-body{padding:.9rem 1rem;display:grid;gap:.55rem;align-content:start}
  .card-top{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;justify-content:space-between}
  .card h3{font-size:1rem;letter-spacing:-.01em}
  .hookline{font-family:var(--serif);font-size:1.12rem;line-height:1.3;color:var(--text)}
  .capline{font-size:.84rem;color:var(--text-2)}
  .tags{font-family:var(--mono);font-size:.7rem;color:var(--violet);word-break:break-word}
  .chip{font-family:var(--mono);font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;
    padding:.25em .5em;border-radius:2px;border:1px solid currentColor}
  .chip.transformation{color:var(--brass)} .chip.education{color:var(--violet-lt)}
  .chip.personality{color:var(--text-2)} .chip.offer{color:var(--warn)}
  .warnline{font-size:.8rem;color:var(--warn);border-left:2px solid var(--warn);padding-left:.6rem}
  .blockline{font-size:.8rem;color:var(--crit);border-left:2px solid var(--crit);padding-left:.6rem}
  .actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.2rem}
  .btn{font-family:var(--mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;
    padding:.5em .95em;border-radius:2px;border:1px solid var(--line-2);transition:all .15s}
  .btn.approve{color:var(--good);border-color:var(--good)}
  .btn.approve:hover{background:var(--good);color:var(--bg)}
  .btn.reject{color:var(--crit);border-color:var(--crit)}
  .btn.reject:hover{background:var(--crit);color:var(--bg)}

  /* lists */
  .rows{display:grid;gap:.4rem}
  .row{display:flex;gap:.75rem;align-items:baseline;justify-content:space-between;
    padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.87rem}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--text-2)}
  .row .v{font-family:var(--mono);font-size:.76rem;text-align:right;color:var(--text)}
  .muted{color:var(--text-3);font-size:.85rem}

  .mixbar{display:flex;height:8px;border-radius:2px;overflow:hidden;margin-bottom:.6rem}
  .mixbar i{display:block}

  /* log */
  .log{font-family:var(--mono);font-size:.72rem;line-height:1.65;max-height:290px;overflow-y:auto;
    background:var(--panel-2);border-radius:var(--r);padding:.7rem .85rem}
  .log div{display:flex;gap:.6rem;white-space:pre-wrap;word-break:break-word}
  .log .t{color:var(--text-3);flex:none}
  .log .s{color:var(--violet-lt);flex:none;min-width:62px}
  .log .m{color:var(--text-2)}
  .log .lv-ok .m{color:var(--good)} .log .lv-warn .m{color:var(--warn)} .log .lv-error .m{color:var(--crit)}

  .cap{display:flex;flex-wrap:wrap;gap:.4rem}
  .cap span{font-family:var(--mono);font-size:.63rem;letter-spacing:.07em;text-transform:uppercase;
    padding:.28em .55em;border-radius:2px;border:1px solid var(--line-2);color:var(--text-3)}
  .cap span.on{color:var(--good);border-color:var(--good)}
  .empty{padding:1.6rem;text-align:center;color:var(--text-3);font-size:.88rem}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Control room</div>
    <div class="brandline">Hair by <em>Sha</em></div>
  </div>
  <div class="hdr-meta" id="hdrMeta"></div>
  <div class="live"><span class="dot" id="liveDot"></span><span id="liveText">connecting</span></div>
</header>

<main>
  <div class="stats" id="stats"></div>

  <section class="panel">
    <div class="phead">
      <div><div class="eyebrow">Pipeline</div></div>
      <button class="runbtn" id="runAll">Run full week</button>
    </div>
    <div class="pipeline" id="pipeline"></div>
  </section>

  <div class="cols">
    <div style="display:grid;gap:1.25rem;align-content:start">
      <section class="panel">
        <div class="phead">
          <div class="eyebrow">Waiting on Sha</div>
          <span class="eyebrow" id="queueCount"></span>
        </div>
        <div class="pbody"><div class="queue" id="queue"></div></div>
      </section>

      <section class="panel">
        <div class="phead"><div class="eyebrow">This week's plan</div><span class="eyebrow" id="weekOf"></span></div>
        <div class="pbody"><div class="rows" id="slots"></div></div>
      </section>
    </div>

    <div style="display:grid;gap:1.25rem;align-content:start">
      <section class="panel">
        <div class="phead"><div class="eyebrow">Connected</div></div>
        <div class="pbody"><div class="cap" id="caps"></div></div>
      </section>

      <section class="panel">
        <div class="phead"><div class="eyebrow">Content mix</div></div>
        <div class="pbody">
          <div class="mixbar" id="mixbar"></div>
          <div class="rows" id="mixrows"></div>
        </div>
      </section>

      <section class="panel">
        <div class="phead"><div class="eyebrow">Footage on hand</div></div>
        <div class="pbody"><div class="rows" id="footage"></div></div>
      </section>

      <section class="panel">
        <div class="phead"><div class="eyebrow">Needs filming</div></div>
        <div class="pbody"><div class="rows" id="shotlist"></div></div>
      </section>

      <section class="panel">
        <div class="phead"><div class="eyebrow">Activity</div></div>
        <div class="pbody"><div class="log" id="log"></div></div>
      </section>
    </div>
  </div>
</main>

<script>
const STAGES = [
  ['ingest','Ingest'],['research','Research'],['plan','Plan'],
  ['cut','Cut'],['gate','Gate'],['ship','Ship'],['learn','Learn'],
];
const MIX_COLOR = { transformation:'#8A5E22', education:'#B07C33', personality:'#6A5B8C', offer:'#8C7CB0' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let snap = null;

function renderPipeline() {
  $('pipeline').innerHTML = STAGES.map(([key,label]) => {
    const st = snap?.stages?.[key] || { status:'idle' };
    return `<div class="node" data-status="${st.status}" data-stage="${key}">
      <div class="node-name">${label}</div>
      <div class="node-status">${st.status}</div>
      <div class="bar"><i data-bar="${key}"></i></div>
      <button class="runbtn" data-run="${key}">run</button>
    </div>`;
  }).join('');
}

function renderStats() {
  if (!snap) return;
  const posts = snap.posts || [];
  const waiting = posts.filter(p => p.status === 'awaiting_approval').length;
  const blocked = posts.filter(p => p.status === 'blocked').length;
  const published = posts.filter(p => p.status === 'published').length;
  const ready = (snap.plan?.slots || []).filter(s => s.status === 'ready_to_cut' || s.status === 'cut').length;
  const cells = [
    { v: waiting, l: 'awaiting approval', cls: waiting ? 'alert' : '' },
    { v: ready, l: 'slots ready', cls: '' },
    { v: blocked, l: 'blocked', cls: blocked ? 'alert' : '' },
    { v: published, l: 'published', cls: published ? 'good' : '' },
    { v: snap.footage?.unused ?? 0, l: 'clips unused', cls: '' },
    { v: snap.trends?.count ?? 0, l: `trends ${snap.trends?.live ? 'live' : 'offline'}`, cls: '' },
  ];
  $('stats').innerHTML = cells.map(c =>
    `<div class="stat ${c.cls}"><div class="v">${c.v}</div><div class="l">${esc(c.l)}</div></div>`
  ).join('');
}

function renderQueue() {
  const posts = (snap?.posts || []).filter(p => p.status === 'awaiting_approval' || p.status === 'blocked');
  $('queueCount').textContent = posts.length ? `${posts.length}` : '';
  if (!posts.length) {
    $('queue').innerHTML = '<div class="empty">Nothing waiting. Run the pipeline to build this week.</div>';
    return;
  }
  $('queue').innerHTML = posts.map(p => {
    const blocked = p.status === 'blocked';
    const warns = (p.gate?.warnings || []).map(w => `<div class="warnline">${esc(w.reason)}</div>`).join('');
    const blocks = (p.gate?.blockers || []).map(b => `<div class="blockline">${esc(b.reason)}</div>`).join('');
    const video = p.renderFile
      ? `<video src="/preview/${encodeURIComponent(p.renderFile)}" muted playsinline preload="metadata" controls></video>`
      : `<div class="empty" style="padding:1rem">no render</div>`;
    return `<article class="card">
      <div>${video}</div>
      <div class="card-body">
        <div class="card-top">
          <h3>${esc(p.formatName || 'Untitled')}</h3>
          <span class="chip ${esc(p.type)}">${esc(p.type)}</span>
        </div>
        <div class="hookline">${esc(p.caption?.hook || '')}</div>
        <div class="capline">${esc(p.caption?.cta || '')}</div>
        <div class="tags">${esc((p.caption?.hashtags || []).join(' '))}</div>
        ${blocks}${warns}
        <div class="row" style="border:none;padding:0">
          <span class="k">${p.durationSec ? p.durationSec.toFixed(1) + 's' : '—'}</span>
          <span class="v">${p.scheduledFor ? new Date(p.scheduledFor).toLocaleString('en-AU',{weekday:'short',hour:'2-digit',minute:'2-digit'}) : ''}</span>
        </div>
        ${blocked ? '' : `<div class="actions">
          <button class="btn approve" data-decide="approve" data-id="${p.id}">Approve</button>
          <button class="btn reject" data-decide="reject" data-id="${p.id}">Reject</button>
        </div>`}
      </div>
    </article>`;
  }).join('');
}

function renderSlots() {
  const slots = snap?.plan?.slots || [];
  $('weekOf').textContent = snap?.plan?.weekOf || '';
  if (!slots.length) { $('slots').innerHTML = '<div class="empty">No plan yet.</div>'; return; }
  $('slots').innerHTML = slots.map(s => `<div class="row">
    <span class="k"><span class="chip ${esc(s.type)}" style="margin-right:.5rem">${esc(s.type)}</span>${esc(s.formatName)}</span>
    <span class="v">${esc(s.status.replace(/_/g,' '))}</span>
  </div>`).join('');
}

function renderSide() {
  const c = snap?.capabilities || {};
  const labels = {
    instagramPublish:'Instagram', tiktokPublish:'TikTok', tiktokDirectPost:'TikTok auto',
    liveResearch:'Firecrawl', bookingUrlSet:'Booking link', consentPolicySet:'Consent',
  };
  $('caps').innerHTML = Object.entries(labels).map(([k,l]) =>
    `<span class="${c[k] ? 'on' : ''}">${esc(l)}</span>`).join('');

  const mix = snap?.mix || {};
  $('mixbar').innerHTML = Object.entries(mix).map(([k,v]) =>
    `<i style="width:${v*100}%;background:${MIX_COLOR[k]||'#666'}"></i>`).join('');
  $('mixrows').innerHTML = Object.entries(mix).map(([k,v]) =>
    `<div class="row"><span class="k">${esc(k)}</span><span class="v">${Math.round(v*100)}%</span></div>`).join('');

  const f = snap?.footage || {};
  const tags = Object.entries(f.byTag || {});
  $('footage').innerHTML = [
    `<div class="row"><span class="k">unused clips</span><span class="v">${f.unused ?? 0}</span></div>`,
    `<div class="row"><span class="k">total runtime</span><span class="v">${f.seconds ?? 0}s</span></div>`,
    ...tags.map(([k,v]) => `<div class="row"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`),
  ].join('');

  const shots = snap?.plan?.shotList || [];
  $('shotlist').innerHTML = shots.length
    ? shots.map(s => `<div class="row" style="display:block">
        <div class="k" style="color:var(--text);font-weight:600">${esc(s.tag)} &times;${s.count}</div>
        <div class="muted" style="margin-top:.2rem">${esc(s.how)}</div></div>`).join('')
    : '<div class="muted">Nothing outstanding.</div>';
}

function addLog(e) {
  const el = $('log');
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  const t = new Date(e.ts).toLocaleTimeString('en-AU',{hour12:false});
  const div = document.createElement('div');
  div.className = 'lv-' + e.level;
  div.innerHTML = `<span class="t">${t}</span><span class="s">${esc(e.stage||'')}</span><span class="m">${esc(e.message)}</span>`;
  el.appendChild(div);
  while (el.children.length > 300) el.removeChild(el.firstChild);
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function renderAll() { renderPipeline(); renderStats(); renderQueue(); renderSlots(); renderSide(); }

function connect() {
  const es = new EventSource('/events');
  es.addEventListener('open', () => {
    $('liveDot').classList.add('on'); $('liveText').textContent = 'live';
  });
  es.addEventListener('error', () => {
    $('liveDot').classList.remove('on'); $('liveText').textContent = 'reconnecting';
  });
  es.addEventListener('snapshot', (ev) => {
    snap = JSON.parse(ev.data);
    const b = snap.business || {};
    $('hdrMeta').innerHTML = [
      ['stylist', b.operator], ['area', `${b.suburb} ${b.region}`],
      ['handle', '@' + b.instagram], ['optimising for', b.objective],
    ].map(([k,v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join('');
    renderAll();
  });
  es.addEventListener('stage', (ev) => {
    const e = JSON.parse(ev.data);
    if (!snap) return;
    snap.stages[e.stage] = { status: e.status, ts: e.ts };
    const node = document.querySelector(`[data-stage="${e.stage}"]`);
    if (node) {
      node.dataset.status = e.status;
      node.querySelector('.node-status').textContent = e.status;
      if (e.status !== 'running') {
        const bar = node.querySelector('[data-bar]');
        if (bar) bar.style.width = e.status === 'done' ? '100%' : '0';
      }
    }
  });
  es.addEventListener('progress', (ev) => {
    const e = JSON.parse(ev.data);
    const key = e.stage === 'render' ? 'cut' : e.stage;
    const bar = document.querySelector(`[data-bar="${key}"]`);
    if (bar) bar.style.width = Math.max(0, Math.min(100, e.pct)) + '%';
  });
  es.addEventListener('log', (ev) => addLog(JSON.parse(ev.data)));
}

async function post(url, body) {
  const res = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  return res.json().catch(() => ({}));
}

document.addEventListener('click', async (ev) => {
  const run = ev.target.closest('[data-run]');
  if (run) return void post('/api/run', { stage: run.dataset.run });

  const decide = ev.target.closest('[data-decide]');
  if (decide) {
    const decision = decide.dataset.decide;
    let reason = null;
    if (decision === 'reject') {
      reason = prompt('Why is this not going out? The planner learns from this.');
      if (reason === null) return;
    }
    decide.disabled = true;
    await post('/api/decide', { postId: decide.dataset.id, decision, reason });
    return;
  }

  if (ev.target.id === 'runAll') {
    for (const s of ['ingest','research','plan','cut','gate']) {
      await post('/api/run', { stage: s });
      await new Promise(r => setTimeout(r, 700));
    }
  }
});

renderPipeline();
connect();
</script>
</body>
</html>
