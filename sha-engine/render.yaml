services:
  - type: web
    name: sha-engine
    runtime: node
    plan: starter
    rootDir: sha-engine
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: sha-engine-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
      # Must match the service's own public URL — Instagram fetches media from it.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_CONNECTED_ACCOUNT_ID
        sync: false
      - key: IG_USER_ID
        value: me
      - key: POSTS_PER_WEEK
        value: "3"
      # Long random string. Anyone holding it can approve posts.
      - key: REVIEW_TOKEN
        generateValue: true

  # Weekly: research, brief, draft, gate, queue for approval. Publishes nothing.
  - type: cron
    name: sha-engine-cycle
    runtime: node
    plan: starter
    rootDir: sha-engine
    schedule: "0 22 * * 0"
    buildCommand: npm ci --omit=dev
    startCommand: npm run cycle
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: PUBLIC_BASE_URL
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_CONNECTED_ACCOUNT_ID
        sync: false
      - key: POSTS_PER_WEEK
        value: "3"

  # Hourly: publish anything Sha approved whose slot has arrived.
  - type: cron
    name: sha-engine-publish
    runtime: node
    plan: starter
    rootDir: sha-engine
    schedule: "0 * * * *"
    buildCommand: npm ci --omit=dev
    startCommand: npm run publish-due
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_CONNECTED_ACCOUNT_ID
        sync: false
      - key: IG_USER_ID
        value: me
