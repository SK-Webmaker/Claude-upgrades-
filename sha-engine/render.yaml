# Blueprint for Gloss.
#
# Deploy this from Render's Blueprints tab, not by hand-creating a service.
# The existing gloss-sha was created through the New-Web-Service form and sits
# outside any project, which is why its settings show no Disks section. A
# Blueprint creates the service inside a project and attaches the disk at
# creation, the same way hairbysha-booking got its /var/data.
#
# Without the disk, data/ lives inside the deploy and is wiped by the next one.
# The week's posts survive either way — those ship in content/ — but the
# scoring history in data/state does not, and without it the engine can never
# compare a week against the one before it.
#
# There is deliberately no cron service here. A Render disk attaches to exactly
# one service, so a separate cron container would write its state to a path
# that no longer persists and that the console cannot read. The week starts
# when Sha presses .start.

services:
  - type: web
    name: gloss
    runtime: node
    plan: starter          # disks require starter or above; free will not work
    region: oregon
    rootDir: sha-engine
    # npm ci needs a committed lockfile and this package has none.
    buildCommand: npm install --omit=dev
    startCommand: node src/dashboard/server.js
    autoDeploy: true
    branch: claude/sha-instagram-composio-34njw7

    disk:
      name: gloss-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "22"
      - key: IG_USER_ID
        value: me
      # Instagram fetches media from this URL server-side, so it has to be the
      # service's own public address. Set it once Render assigns the hostname.
      - key: PUBLIC_MEDIA_BASE_URL
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_CONNECTED_ACCOUNT_ID
        sync: false
      - key: COMPOSIO_USER_ID
        value: sha
      # Guards POST /api/plan. The route is closed entirely when this is unset.
      - key: PLAN_TOKEN
        generateValue: true
      - key: FIRECRAWL_API_KEY
        sync: false
