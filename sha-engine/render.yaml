services:
  - type: web
    name: gloss-sha
    runtime: node
    plan: starter
    rootDir: sha-engine
    buildCommand: npm ci --omit=dev
    startCommand: npm run dashboard
    envVars:
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /var/data
      # Instagram fetches media from this URL, so it must be the service's own.
      - key: PUBLIC_MEDIA_BASE_URL
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_CONNECTED_ACCOUNT_ID
        sync: false
      - key: IG_USER_ID
        value: me
      # Optional. Without it the chat box falls back to the command allowlist.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
    disk:
      name: gloss-data
      mountPath: /var/data
      sizeGB: 5

  # Weekly kick-off. Reviews, sets the target, briefs, gates. Publishes nothing.
  - type: cron
    name: gloss-start-week
    runtime: node
    plan: starter
    rootDir: sha-engine
    schedule: "0 20 * * 0"
    buildCommand: npm ci --omit=dev
    startCommand: node src/cli.js .start
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_MEDIA_BASE_URL
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_CONNECTED_ACCOUNT_ID
        sync: false
